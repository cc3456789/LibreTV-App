name: Build NAS LibreTV TV APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
      - name: Generate temporary signing key
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/libretv.p12" \
            -storetype PKCS12 -storepass 123456 -keypass 123456 \
            -alias libretv-app -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=LibreTV NAS, OU=Home, O=LibreTV, L=NA, ST=NA, C=CN"
      - name: Build, test and package
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/libretv.p12
          ANDROID_KEYSTORE_PASSWORD: '123456'
        run: |
          gradle -p android --no-daemon testDebugUnitTest assembleRelease
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/LibreTV-NAS.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs out/LibreTV-NAS.apk
          echo "SHA256:" && sha256sum out/LibreTV-NAS.apk
      - uses: actions/upload-artifact@v4
        with:
          name: libretv-nas-apk
          path: out/
